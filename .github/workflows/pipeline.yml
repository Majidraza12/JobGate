# Pipeline every 2 hours: pull new listings, then fetch their job descriptions, into
# hosted Supabase. No Claude calls here; extraction runs by hand on Majid's PC.
name: pipeline

on:
  schedule:
    # Minute 17 of every second hour (UTC), off the busy top of the hour. Every
    # 2 hours, not hourly: about 720 of the private repo's 2,000 free Actions
    # minutes a month, and extraction is weekly, so hourly gains nothing yet.
    - cron: "17 */2 * * *"
  workflow_dispatch: {} # "Run workflow" button for manual runs

# Never two runs at once. A queued run waits instead of cancelling the one in
# progress. The Postgres advisory lock in pipeline/db.ts is the second guard.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest listings
        run: npm run ingest -- --trigger "$TRIGGER"
      - name: Fetch job descriptions
        run: npm run fetch-jds -- --trigger "$TRIGGER"
