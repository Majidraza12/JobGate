<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobGate Labeling</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --accent: #2f5bd3; --mark: #fff1a8; --ok: #1f7a3d; --err: #b42318; --chip: #eef1fb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecece8; --muted: #9b9b94; --line: #33332f;
            --accent: #8aa6ff; --mark: #5a4e12; --ok: #5cc98a; --err: #ff8a80; --chip: #262a38; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 520px); gap: 0; height: calc(100vh - 53px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
  #jd { overflow: auto; padding: 16px 20px; border-right: 1px solid var(--line); }
  #jd .title { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  #jd .sub { color: var(--muted); margin-bottom: 14px; }
  #jd .sub a { color: var(--accent); }
  #jdtext { white-space: pre-wrap; font: 14px/1.55 ui-serif, Georgia, serif; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  #form { overflow: auto; padding: 12px 16px 80px; background: var(--panel); }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 8px 10px 10px; }
  legend { font-weight: 600; padding: 0 4px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
  .row label { display: inline-flex; gap: 4px; align-items: center; }
  .hint { color: var(--muted); font-size: 12px; }
  .value { margin-top: 4px; padding-left: 2px; }
  .value.off { opacity: .35; pointer-events: none; }
  .ev { margin-top: 6px; }
  .ev ul { margin: 4px 0; padding-left: 18px; }
  .ev li { font-size: 12px; }
  .ev li button { margin-left: 6px; }
  .window { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { padding: 1px 6px; font-size: 12px; }
  input[type=text], input[type=month], select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  textarea { width: 100%; min-height: 60px; }
  .chip { background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  #msg { min-height: 18px; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--err); white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>JobGate Labeling</h1>
  <span class="meta" id="progress"></span>
  <span class="spacer"></span>
  <label class="meta">Labeler <input type="text" id="labeler" size="10"></label>
  <button id="prev">Prev</button>
  <select id="jump"></select>
  <button id="next">Next</button>
  <button class="primary" id="save" title="Ctrl+S">Save and next unlabeled</button>
</header>
<main>
  <section id="jd">
    <p class="title" id="jdtitle"></p>
    <div class="sub" id="jdsub"></div>
    <div id="jdtext"></div>
  </section>
  <section id="form">
    <div id="msg"></div>
    <p class="hint">Label only what the posting says. Preferred or "nice to have" language is strength Preferred. Select text on the left, then "Add selection" to attach a quote (optional).</p>
    <div id="fields"></div>
    <fieldset>
      <legend>Adversarial tags</legend>
      <div class="row" id="tags"></div>
    </fieldset>
    <fieldset>
      <legend>Notes</legend>
      <textarea id="notes" placeholder="Anything odd about this posting"></textarea>
    </fieldset>
  </section>
</main>
<script>
const FIELDS = [
  ["grad_requirements", "Graduation window", "windows"],
  ["must_return_to_school", "Must return to school", "bool"],
  ["class_years", "Class years", "multi", ["freshman", "sophomore", "junior", "senior", "masters", "phd"]],
  ["degree_levels", "Degree levels", "multi", ["bs", "ms", "phd"]],
  ["start_options", "Start options", "starts"],
  ["citizenship_required", "U.S. citizenship required", "bool"],
  ["us_person_required", "U.S. person (ITAR/EAR) required", "bool"],
  ["sponsorship_now_unavailable", "No visa sponsorship now", "bool"],
  ["sponsorship_future_unavailable", "No sponsorship now or in future", "bool"],
  ["clearance", "Security clearance", "clearance"],
];
const TAGS = ["boundary_grad_date", "contradiction", "preferred_sounds_required", "multiple_windows_or_starts", "itar_vs_citizenship", "ability_vs_active_clearance"];
const HIGHLIGHT = /(citizen\w*|sponsor\w*|visa\w*|clearance|ITAR|EAR\b|export control\w*|U\.S\. person\w*|US person\w*|permanent resident\w*|green card|asylee\w*|refugee\w*|authoriz\w*|graduat\w*|return\w* to school|semester\w* remaining|rising|freshm[ae]n|sophomore\w*|junior\w*|senior\w*|bachelor\w*|master\w*|Ph\.?D\.?|degree|enrolled|class of \d{4}|polygraph|TS\/SCI|top secret|secret)/gi;

let state, index = 0;
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (e.className = v) : k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
};
const item = () => state.dataset.items[index];
const labeled = (id) => Boolean(state.labels[id]);

try { $("labeler").value = localStorage.getItem("labeler") || "majid"; } catch { $("labeler").value = "majid"; }
$("labeler").addEventListener("change", () => { try { localStorage.setItem("labeler", $("labeler").value); } catch {} });

function msg(text, kind = "") { $("msg").textContent = text; $("msg").className = kind; }

function radios(name, options, selected, onchange) {
  const row = el("div", { class: "row" });
  for (const [value, label] of options) {
    const input = el("input", { type: "radio", name, value });
    if (value === selected) input.checked = true;
    if (onchange) input.addEventListener("change", onchange);
    row.append(el("label", {}, input, label));
  }
  return row;
}
const radioValue = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value ?? null;

function windowRow(w = {}) {
  const box = el("div", { class: "window" });
  const degs = el("div", { class: "row" }, el("span", { class: "hint" }, "Applies to degrees (none = everyone):"));
  for (const d of ["bs", "ms", "phd"]) {
    const cb = el("input", { type: "checkbox", "data-k": "deg", value: d });
    if ((w.applies_to_degrees || []).includes(d)) cb.checked = true;
    degs.append(el("label", {}, cb, d));
  }
  const start = el("input", { type: "text", "data-k": "start", placeholder: "any start", size: "12" });
  start.value = w.applies_to_start || "";
  const earliest = el("input", { type: "month", "data-k": "earliest" });
  earliest.value = w.earliest || "";
  const latest = el("input", { type: "month", "data-k": "latest" });
  latest.value = w.latest || "";
  box.append(
    degs,
    el("div", { class: "row" }, el("label", {}, "Start term ", start)),
    el("div", { class: "row" }, el("label", {}, "Earliest ", earliest), el("label", {}, "Latest ", latest),
      el("button", { class: "small", type: "button", onclick: () => box.remove() }, "Remove")),
  );
  return box;
}

function startRow(s = {}) {
  const label = el("input", { type: "text", "data-k": "label", placeholder: "Summer 2027", size: "14" });
  label.value = s.label || "";
  const month = el("input", { type: "month", "data-k": "month" });
  month.value = s.month || "";
  const row = el("div", { class: "row window" }, el("label", {}, "Label ", label), el("label", {}, "Month ", month));
  row.append(el("button", { class: "small", type: "button", onclick: () => row.remove() }, "Remove"));
  return row;
}

function valueEditor(key, kind, opts, value) {
  const box = el("div", { class: "value", id: `v-${key}` });
  if (kind === "bool") box.append(radios(`val-${key}`, [["true", "Yes"], ["false", "No (posting says it is not required)"]], value === false ? "false" : "true"));
  if (kind === "multi")
    for (const o of opts) {
      const cb = el("input", { type: "checkbox", value: o });
      if ((value || []).includes(o)) cb.checked = true;
      box.append(el("label", { style: "margin-right:10px" }, cb, o));
    }
  if (kind === "windows") {
    const list = el("div", { "data-list": "1" });
    for (const w of value || []) list.append(windowRow(w));
    box.append(list, el("button", { class: "small", type: "button", onclick: () => list.append(windowRow()) }, "Add window"));
  }
  if (kind === "starts") {
    const list = el("div", { "data-list": "1" });
    for (const s of value || []) list.append(startRow(s));
    box.append(list, el("button", { class: "small", type: "button", onclick: () => list.append(startRow()) }, "Add start"));
  }
  if (kind === "clearance") {
    const req = el("select", { "data-k": "required" });
    for (const r of ["active", "ability_to_obtain", "preferred"]) req.append(el("option", { value: r }, r));
    const lvl = el("select", { "data-k": "level" });
    for (const l of ["", "secret", "top_secret", "ts_sci"]) lvl.append(el("option", { value: l }, l || "no level named"));
    if (value) { req.value = value.required; lvl.value = value.level || ""; }
    box.append(el("div", { class: "row" }, el("label", {}, "Required ", req), el("label", {}, "Level ", lvl)));
  }
  return box;
}

function readValue(key, kind) {
  const box = $(`v-${key}`);
  if (kind === "bool") return radioValue(`val-${key}`) === "true";
  if (kind === "multi") { const v = [...box.querySelectorAll("input:checked")].map((c) => c.value); return v.length ? v : null; }
  if (kind === "windows") {
    const v = [...box.querySelectorAll(".window")].map((w) => {
      const degs = [...w.querySelectorAll('[data-k="deg"]:checked')].map((c) => c.value);
      const get = (k) => w.querySelector(`[data-k="${k}"]`).value.trim() || null;
      return { applies_to_degrees: degs.length ? degs : null, applies_to_start: get("start"), earliest: get("earliest"), latest: get("latest"), evidence: [] };
    });
    return v.length ? v : null;
  }
  if (kind === "starts") {
    const v = [...box.querySelectorAll(".window")].map((r) => ({
      label: r.querySelector('[data-k="label"]').value.trim(),
      month: r.querySelector('[data-k="month"]').value || null,
    })).filter((s) => s.label);
    return v.length ? v : null;
  }
  if (kind === "clearance") return { required: box.querySelector('[data-k="required"]').value, level: box.querySelector('[data-k="level"]').value || null };
}

function renderEvidence(key, quotes) {
  const ul = $(`ev-${key}`);
  ul.replaceChildren(...quotes.map((q, i) => el("li", {}, q, el("button", { class: "small", type: "button", onclick: () => { quotes.splice(i, 1); renderEvidence(key, quotes); } }, "x"))));
}

const evidence = {};
function renderForm(label) {
  const fields = $("fields");
  fields.replaceChildren();
  for (const [key, title, kind, opts] of FIELDS) {
    const f = label?.fields[key] ?? { status: "not_mentioned", value: null, strength: null, evidence: [] };
    evidence[key] = [...(f.evidence || [])];
    const sync = () => $(`v-${key}`).classList.toggle("off", radioValue(`st-${key}`) === "not_mentioned");
    const fs = el("fieldset", {}, el("legend", {}, title));
    fs.append(
      radios(`st-${key}`, [["not_mentioned", "Not mentioned"], ["stated", "Stated"], ["ambiguous", "Ambiguous"]], f.status, sync),
      radios(`sg-${key}`, [["required", "Required"], ["preferred", "Preferred"]], f.strength ?? "required"),
      valueEditor(key, kind, opts, f.value),
      el("div", { class: "ev" },
        el("button", { class: "small", type: "button", onclick: () => {
          const s = window.getSelection().toString().trim();
          if (s) { evidence[key].push(s); renderEvidence(key, evidence[key]); }
        } }, "Add selection as quote"),
        el("ul", { id: `ev-${key}` })),
    );
    fields.append(fs);
    renderEvidence(key, evidence[key]);
    sync();
  }
  $("tags").replaceChildren(...TAGS.map((t) => {
    const cb = el("input", { type: "checkbox", value: t });
    if (label?.tags?.includes(t)) cb.checked = true;
    return el("label", {}, cb, t);
  }));
  $("notes").value = label?.notes ?? "";
}

function collect() {
  const fields = {};
  for (const [key, , kind] of FIELDS) {
    const status = radioValue(`st-${key}`);
    if (status === "not_mentioned") { fields[key] = { status, value: null, strength: null, evidence: [] }; continue; }
    fields[key] = { status, value: readValue(key, kind), strength: radioValue(`sg-${key}`), evidence: evidence[key] };
  }
  return {
    labeler: $("labeler").value.trim(),
    fields,
    tags: [...$("tags").querySelectorAll("input:checked")].map((c) => c.value),
    notes: $("notes").value,
  };
}

function render() {
  const it = item();
  $("jdtitle").textContent = `${it.company}: ${it.title}`;
  $("jdsub").innerHTML = `<span class="chip">${esc(it.stratum)}</span> <span class="chip">${esc(it.ats ?? "other")}</span> ${esc(it.id)} &middot; <a href="${esc(it.applyUrl)}" target="_blank" rel="noopener">original posting</a>${labeled(it.id) ? ' &middot; <span class="chip">labeled</span>' : ""}`;
  $("jdtext").innerHTML = esc(it.jdText).replace(HIGHLIGHT, "<mark>$1</mark>");
  $("jd").scrollTop = 0;
  $("form").scrollTop = 0;
  renderForm(state.labels[it.id]);
  const done = state.dataset.items.filter((i) => labeled(i.id)).length;
  $("progress").textContent = `${index + 1} of ${state.dataset.items.length} · ${done} labeled`;
  $("jump").replaceChildren(...state.dataset.items.map((i, n) => el("option", { value: String(n) }, `${labeled(i.id) ? "✓ " : ""}${i.id}`)));
  $("jump").value = String(index);
  msg("");
}

async function save() {
  const it = item();
  const res = await fetch(`/api/labels/${it.id}`, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(collect()) });
  const body = await res.json();
  if (!res.ok) { msg((body.errors || [body.error]).join("\n"), "err"); return false; }
  state.labels[it.id] = body;
  return true;
}

async function saveAndNext() {
  if (!(await save())) return;
  const items = state.dataset.items;
  const nextIdx = [...items.keys()].map((k) => (index + 1 + k) % items.length).find((k) => !labeled(items[k].id));
  if (nextIdx === undefined) { render(); msg("Saved. Every JD is labeled.", "ok"); return; }
  index = nextIdx;
  render();
  msg("Saved.", "ok");
}

$("save").addEventListener("click", saveAndNext);
$("prev").addEventListener("click", () => { index = (index - 1 + state.dataset.items.length) % state.dataset.items.length; render(); });
$("next").addEventListener("click", () => { index = (index + 1) % state.dataset.items.length; render(); });
$("jump").addEventListener("change", (e) => { index = Number(e.target.value); render(); });
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveAndNext(); } });

fetch("/api/state").then((r) => r.json()).then((s) => {
  state = s;
  const first = s.dataset.items.findIndex((i) => !s.labels[i.id]);
  index = first < 0 ? 0 : first;
  render();
});
</script>
</body>
</html>
